name: 'Qt build (Windows)'

# The Qt suite of KiCad (KICAD_WX_FREE + KICAD_QT_SHELL) on Windows, with MSVC and the libraries
# of vcpkg (the "qt" feature of vcpkg.json, release only).  Two jobs, each within the time limit
# of a job: the libraries of vcpkg first (kept in the cache), then KiCad.

on:
  push:
    branches: [ 'wx-free-core-upstream' ]
    paths-ignore: [ '**.md', 'demos/**', 'translation/**' ]
  workflow_dispatch:

concurrency:
  group: qt-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  # Not VCPKG_ROOT: the environment of MSVC (msvc-dev-cmd) sets it to the vcpkg of Visual Studio
  KICAD_VCPKG_ROOT: C:\vcpkg-kicad
  VCPKG_DEFAULT_TRIPLET: x64-windows-release
  VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}\qt\tools\vcpkg-triplets
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-cache,readwrite
  VCPKG_INSTALLED_DIR: ${{ github.workspace }}\vcpkg_installed

jobs:
  vcpkg:
    name: 'vcpkg libraries'
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: vcpkg
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:KICAD_VCPKG_ROOT
          git clone --filter=tree:0 https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\vcpkg-cache" | Out-Null

      - name: Restore the libraries
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-cache
          key: vcpkg-qt-windows-${{ hashFiles( 'vcpkg.json', 'vcpkg-configuration.json', 'qt/tools/vcpkg-triplets/**' ) }}
          restore-keys: |
            vcpkg-qt-windows-${{ hashFiles( 'vcpkg.json', 'vcpkg-configuration.json', 'qt/tools/vcpkg-triplets/**' ) }}-
            vcpkg-qt-windows-

      - name: Build the libraries
        if: steps.restore.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:KICAD_VCPKG_ROOT
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            --x-manifest-root="${{ github.workspace }}" `
            --x-install-root="$env:VCPKG_INSTALLED_DIR" `
            --x-no-default-features --x-feature=qt `
            --triplet $env:VCPKG_DEFAULT_TRIPLET --host-triplet $env:VCPKG_DEFAULT_TRIPLET `
            --clean-after-build

      - name: Logs of the failed ports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs
          path: ${{ env.KICAD_VCPKG_ROOT }}\buildtrees\**\*.log
          if-no-files-found: ignore

      - name: Save the libraries
        if: success() && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg-cache
          key: vcpkg-qt-windows-${{ hashFiles( 'vcpkg.json', 'vcpkg-configuration.json', 'qt/tools/vcpkg-triplets/**' ) }}

      # Also when a port fails: the next run starts from the ports already built
      - name: Save the libraries built so far
        if: failure() && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg-cache
          key: vcpkg-qt-windows-${{ hashFiles( 'vcpkg.json', 'vcpkg-configuration.json', 'qt/tools/vcpkg-triplets/**' ) }}-partial-${{ github.run_id }}-${{ github.run_attempt }}

  build:
    name: 'KiCad (MSVC)'
    needs: vcpkg
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Tools
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:KICAD_VCPKG_ROOT
          choco install -y --no-progress swig ccache
          git clone --filter=tree:0 https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Restore the libraries
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-cache
          key: vcpkg-qt-windows-${{ hashFiles( 'vcpkg.json', 'vcpkg-configuration.json', 'qt/tools/vcpkg-triplets/**' ) }}
          fail-on-cache-miss: true

      - name: Compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-qt-windows-${{ github.sha }}
          restore-keys: ccache-qt-windows-

      # USE_CCACHE, not CMAKE_CXX_COMPILER_LAUNCHER: with it the debug information of MSVC is in
      # the objects (/Z7), which ccache can keep, not in a PDB (/Zi: every compilation uncacheable)
      - name: Configure
        shell: pwsh
        env:
          CCACHE_DIR: ${{ github.workspace }}\.ccache
        run: |
          $env:VCPKG_ROOT = $env:KICAD_VCPKG_ROOT
          # The prefix of the package: the Python module and the data have absolute install paths
          $prefix = "${{ github.workspace }}\pkg" -replace '\\', '/'
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$prefix" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="$env:VCPKG_DEFAULT_TRIPLET" `
            -DVCPKG_HOST_TRIPLET="$env:VCPKG_DEFAULT_TRIPLET" `
            -DVCPKG_OVERLAY_TRIPLETS="$env:VCPKG_OVERLAY_TRIPLETS" `
            -DVCPKG_INSTALLED_DIR="$env:VCPKG_INSTALLED_DIR" `
            -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON -DVCPKG_MANIFEST_FEATURES=qt `
            -DUSE_CCACHE=ON `
            -DCMAKE_EXE_LINKER_FLAGS=/DEBUG -DCMAKE_SHARED_LINKER_FLAGS=/DEBUG -DCMAKE_MODULE_LINKER_FLAGS=/DEBUG `
            -DKICAD_WX_FREE=ON -DKICAD_QT_SHELL=ON -DKICAD_BUILD_QA_TESTS=ON `
            -DKICAD_SCRIPTING_WXPYTHON=OFF -DKICAD_USE_PCH=OFF

      - name: Build
        id: build
        shell: pwsh
        env:
          CCACHE_DIR: ${{ github.workspace }}\.ccache
          CCACHE_MAXSIZE: 3G
        run: |
          $env:VCPKG_ROOT = $env:KICAD_VCPKG_ROOT
          # The names of the targets (the paths of the programs end with .exe)
          cmake --build build --target all `
            qa_qt_eeschema_frames qa_qt_pcbnew_frames qa_qt_tool_framework `
            qa_qt_3d_viewer qa_qt_kicad_shell -- -k 0 2>&1 |
            Tee-Object -FilePath build\compilation_log.txt
          if( $LASTEXITCODE -ne 0 ) { exit $LASTEXITCODE }
          ccache --show-stats

      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-qt-windows-${{ github.sha }}

      - name: Compilation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compilation-log-windows
          path: build/compilation_log.txt
          if-no-files-found: ignore

      # The screen of the runner is 1024x768: the larger dialogs (the preferences) do not fit.
      # Close to the virtual screen of the QA on Linux (1920x1200).
      - name: Screen resolution
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { Write-Host "Set-DisplayResolution: $_" }
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

      # OpenGL 2.1+ without a GPU: the llvmpipe of Mesa (opengl32.dll next to the programs, found
      # before the one of the system, which only has OpenGL 1.1).  A fixed version: the archives
      # of mesa-dist-win 26 no longer have the OpenGL of Windows (WGL).
      - name: Mesa
        shell: pwsh
        run: |
          $version = '25.2.7'
          New-Item -ItemType Directory -Force -Path mesa | Out-Null
          Invoke-WebRequest -OutFile mesa\mesa.7z `
            "https://github.com/pal1000/mesa-dist-win/releases/download/$version/mesa3d-$version-release-msvc.7z"
          7z x -y -omesa mesa\mesa.7z x64\opengl32.dll x64\libgallium_wgl.dll
          if( $LASTEXITCODE -ne 0 ) { exit $LASTEXITCODE }
          foreach( $dir in 'build\qt\qa', 'build\kicad' ) {
            Copy-Item mesa\x64\*.dll $dir
          }
          Get-ChildItem build\qt\qa\*.dll

      # Minidumps of the programs that crash (Windows Error Reporting)
      - name: Crash dumps
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          New-Item -Force -Path $key | Out-Null
          New-ItemProperty -Force -Path $key -Name DumpFolder -PropertyType ExpandString -Value "${{ github.workspace }}\qa-dumps" | Out-Null
          New-ItemProperty -Force -Path $key -Name DumpType -PropertyType DWord -Value 1 | Out-Null
          New-Item -ItemType Directory -Force -Path qa-dumps | Out-Null

      - name: QA of the Qt frames
        shell: pwsh
        env:
          KICAD_RUN_FROM_BUILD_DIR: '1'
          # The Python of vcpkg (PYTHONHOME), not the directory of the program
          KICAD_USE_EXTERNAL_PYTHONHOME: '1'
          GALLIUM_DRIVER: llvmpipe
          QT_QPA_PLATFORM: windows
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "${{ github.workspace }}"
          $inst = "$env:VCPKG_INSTALLED_DIR\$env:VCPKG_DEFAULT_TRIPLET"
          # The DLLs: vcpkg (Qt, Python, ngspice...) and the libraries of the build
          $dirs = @( "$inst\bin" ) + ( Get-ChildItem build -Recurse -Filter *.dll |
                                       ForEach-Object { $_.DirectoryName } | Sort-Object -Unique )
          $env:PATH = ( $dirs -join ';' ) + ';' + $env:PATH
          $env:QT_PLUGIN_PATH = ( Get-ChildItem $inst -Recurse -Filter qwindows.dll |
                                  Select-Object -First 1 ).Directory.Parent.FullName
          $env:PYTHONHOME = ( Get-ChildItem $inst -Recurse -Filter os.py |
                              Where-Object { $_.Directory.Name -eq 'Lib' } |
                              Select-Object -First 1 ).Directory.Parent.FullName
          # The module pcbnew.py of the build (the Linux code of python_scripting.cpp adds it)
          $env:PYTHONPATH = "$root\build\pcbnew"
          Write-Output "QT_PLUGIN_PATH=$env:QT_PLUGIN_PATH PYTHONHOME=$env:PYTHONHOME"

          $board = "$root\qa\data\pcbnew\api_kitchen_sink.kicad_pcb"
          $sch = "$root\qa\data\eeschema\erc_multiple_pin_to_pin.kicad_sch"
          $out = "$root\qa-screenshots"
          New-Item -ItemType Directory -Force -Path $out, "$root\qa-logs" | Out-Null
          $failed = @()

          # Each program with a time limit; all of them run, the failures are listed at the end.
          # Its output in files (the programs of a step have no console), shown after it.
          function Run-Test( [string] $aDir, [string] $aExe, [string[]] $aArgs ) {
            Write-Output "::group::$aExe"
            $log = "$root\qa-logs\$aExe"
            $p = Start-Process -FilePath "$root\$aDir\$aExe.exe" -ArgumentList $aArgs `
                   -WorkingDirectory "$root\$aDir" -NoNewWindow -PassThru `
                   -RedirectStandardOutput "$log.out.txt" -RedirectStandardError "$log.err.txt"
            $null = $p.Handle   # keeps the exit code
            if( -not $p.WaitForExit( 900000 ) ) {
              # What is on the screen (a dialog that waits?)
              try {
                Add-Type -AssemblyName System.Windows.Forms, System.Drawing
                $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
                $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
                [System.Drawing.Graphics]::FromImage( $bmp ).CopyFromScreen( $b.Location, [System.Drawing.Point]::Empty, $b.Size )
                $bmp.Save( "$out\$aExe-timeout.png" )
              } catch { Write-Output "No screenshot: $_" }
              Stop-Process -Id $p.Id -Force
              $p.WaitForExit()
              $code = 'timeout'
            } else {
              $code = if( $p.ExitCode -eq 0 ) { 0 } else { '0x{0:X8}' -f $p.ExitCode }
            }
            Get-Content "$log.out.txt", "$log.err.txt" -ErrorAction SilentlyContinue
            Write-Output "::endgroup::"
            Write-Output "$aExe : $code"
            if( $code -ne 0 ) { $script:failed += "$aExe ($code)" }
          }

          Run-Test 'build\qt\qa' 'qa_qt_pcbnew_frames' @( $board )
          Run-Test 'build\qt\qa' 'qa_qt_tool_framework' @( $board )
          Run-Test 'build\qt\qa' 'qa_qt_3d_viewer' @( $board )
          Run-Test 'build\qt\qa' 'qa_qt_eeschema_frames' @( $sch )
          Run-Test 'build\kicad' 'qa_qt_kicad_shell' @( $board, $sch, "$out\shell.png" )

          if( $failed.Count -gt 0 ) {
            Write-Output "Failed: $( $failed -join ', ' )"
            exit 1
          }

      - name: Screenshots, output and crash dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-windows
          path: |
            qa-screenshots
            qa-logs
            qa-dumps
          if-no-files-found: ignore

      # The package: the installed tree of KiCad (bin, share\kicad, lib\ngspice), with what it
      # needs from vcpkg: the DLLs it loads, the plugins of Qt (qt.conf: not the ones of vcpkg),
      # the library of Python (its home is the directory of the programs), the code models of
      # ngspice and the configuration of fontconfig (etc\fonts, found by the programs); then the
      # libraries of KiCad (symbols, footprints, templates; not the 3D models, several GB).
      # No OpenGL of Mesa: the drivers of the computer.
      - name: Package
        if: always() && steps.build.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "${{ github.workspace }}"
          $inst = "$env:VCPKG_INSTALLED_DIR\$env:VCPKG_DEFAULT_TRIPLET"
          $pkg = "$root\pkg"
          $bin = "$pkg\bin"

          cmake --install build --prefix $pkg
          if( $LASTEXITCODE -ne 0 ) { exit $LASTEXITCODE }

          # The plugins of Qt (platforms, styles, image formats...), found by qt.conf
          $plugins = ( Get-ChildItem $inst -Recurse -Filter qwindows.dll |
                       Select-Object -First 1 ).Directory.Parent.FullName
          Copy-Item -Recurse $plugins "$bin\qtplugins"
          Set-Content -Path "$bin\qt.conf" -Value "[Paths]`r`nPrefix = .`r`nPlugins = qtplugins"

          # Python: its library in bin\Lib and bin\DLLs (pcbnew.py is in bin\Lib\site-packages)
          $python = ( Get-ChildItem $inst -Recurse -Filter os.py |
                      Where-Object { $_.Directory.Name -eq 'Lib' } |
                      Select-Object -First 1 ).Directory.Parent.FullName
          Copy-Item -Recurse -Force "$python\Lib" $bin
          if( Test-Path "$python\DLLs" ) { Copy-Item -Recurse -Force "$python\DLLs" $bin }
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$bin\Lib\test"

          # The code models of ngspice, the configuration of fontconfig
          foreach( $dir in 'lib\ngspice', 'share\ngspice', 'etc\fonts' ) {
            if( Test-Path "$inst\$dir" ) {
              New-Item -ItemType Directory -Force -Path ( Split-Path "$pkg\$dir" ) | Out-Null
              Copy-Item -Recurse -Force "$inst\$dir" "$pkg\$dir"
            }
          }
          if( -not ( Test-Path "$pkg\etc\fonts\fonts.conf" ) ) { throw "no fonts.conf in $inst\etc\fonts" }

          # The DLLs of the libraries (Qt, OpenCASCADE, Python...): the ones the binaries of the
          # package depend on, then theirs (dumpbin); and the ones loaded by name: ngspice (the
          # simulator), OpenSSL (the TLS plugin of Qt)
          $available = @{}
          Get-ChildItem "$inst\bin\*.dll" | ForEach-Object { $available[$_.Name.ToLower()] = $_.FullName }
          $copied = @{}
          $queue = New-Object System.Collections.Queue
          function Add-Dll( [string] $aName ) {
            $key = $aName.ToLower()
            if( $available.ContainsKey( $key ) -and -not $copied.ContainsKey( $key ) ) {
              $copied[$key] = $true
              Copy-Item $available[$key] $bin
              $queue.Enqueue( "$bin\$( Split-Path -Leaf $available[$key] )" )
            }
          }
          Get-ChildItem $pkg -Recurse -File -Include *.exe, *.dll, *.kiface, *.pyd, *.cm |
            ForEach-Object { $queue.Enqueue( $_.FullName ) }
          Get-ChildItem "$inst\bin" -Include ngspice*.dll, libssl*.dll, libcrypto*.dll -Recurse |
            ForEach-Object { Add-Dll $_.Name }
          while( $queue.Count -gt 0 ) {
            $file = $queue.Dequeue()
            foreach( $line in ( dumpbin /nologo /dependents $file ) ) {
              if( $line -match '^\s+(\S+\.dll)\s*$' ) { Add-Dll $Matches[1] }
            }
          }
          "DLLs of vcpkg: {0} of {1}" -f $copied.Count, $available.Count

      - name: Libraries
        if: always() && steps.build.outcome == 'success'
        shell: pwsh
        # The tools of the libraries write UTF-8 (the symbols have Greek letters): not the code page
        # of Windows
        env:
          PYTHONUTF8: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "${{ github.workspace }}"
          $pkg = "$root\pkg"
          $bin = "$pkg\bin"
          # The libraries of the version of KiCad (its tag, else the branch of its series)
          $version = ( Select-String -Path cmake\KiCadVersion.cmake -Pattern 'KICAD_SEMANTIC_VERSION "([^"]+)"' ).Matches[0].Groups[1].Value
          $series = ( $version -split '\.' )[0..1] -join '.'
          New-Item -ItemType Directory -Force -Path libs | Out-Null

          foreach( $repo in 'kicad-symbols', 'kicad-footprints', 'kicad-templates' ) {
            Write-Output "::group::$repo"
            git clone -q --depth 1 --branch $version "https://gitlab.com/kicad/libraries/$repo.git" "libs\$repo"
            if( $LASTEXITCODE -ne 0 ) {
              git clone -q --depth 1 --branch $series "https://gitlab.com/kicad/libraries/$repo.git" "libs\$repo"
              if( $LASTEXITCODE -ne 0 ) { exit $LASTEXITCODE }
            }
            git -C "libs\$repo" log -1 --format='%H %d'
            # Their install: share\kicad (the symbols packed into one file per library), the tables
            # in share\kicad\template
            cmake -S "libs\$repo" -B "libs\build-$repo" -G Ninja "-DCMAKE_INSTALL_PREFIX=$pkg"
            if( $LASTEXITCODE -ne 0 ) { exit $LASTEXITCODE }
            cmake --build "libs\build-$repo"
            if( $LASTEXITCODE -ne 0 ) { exit $LASTEXITCODE }
            cmake --install "libs\build-$repo" | Select-Object -Last 3
            if( $LASTEXITCODE -ne 0 ) { exit $LASTEXITCODE }
            Write-Output "::endgroup::"
          }

          foreach( $dir in 'symbols', 'footprints', 'template' ) {
            "{0}: {1} entries" -f $dir, ( Get-ChildItem "$pkg\share\kicad\$dir" ).Count
          }
          foreach( $table in 'sym-lib-table', 'fp-lib-table' ) {
            if( -not ( Test-Path "$pkg\share\kicad\template\$table" ) ) { throw "no $table" }
          }

          Get-ChildItem $bin -Filter *.exe | Format-Table Name, Length
          Get-ChildItem $bin -Filter *.kiface | Format-Table Name, Length
          "{0:N0} MB" -f ( ( Get-ChildItem $pkg -Recurse -File | Measure-Object Length -Sum ).Sum / 1MB )

      # The package alone: a copy with the test of the shell (and the OpenGL of Mesa), without the
      # build tree, the DLLs of vcpkg or Python in the PATH
      - name: Test of the package
        if: always() && steps.build.outcome == 'success'
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
          QT_QPA_PLATFORM: windows
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "${{ github.workspace }}"
          $test = "$root\pkg-test"
          Copy-Item -Recurse "$root\pkg" $test
          Copy-Item "$root\build\kicad\qa_qt_kicad_shell.exe", "$root\mesa\x64\*.dll" "$test\bin"
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          Remove-Item Env:\PYTHONHOME, Env:\PYTHONPATH, Env:\QT_PLUGIN_PATH -ErrorAction SilentlyContinue

          $board = "$root\qa\data\pcbnew\api_kitchen_sink.kicad_pcb"
          $sch = "$root\qa\data\eeschema\erc_multiple_pin_to_pin.kicad_sch"
          $out = "$root\pkg-logs"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $failed = @()

          function Run-Package( [string] $aName, [string] $aExe, [string[]] $aArgs ) {
            Write-Output "::group::$aName"
            $p = Start-Process -FilePath "$test\bin\$aExe" -ArgumentList $aArgs `
                   -WorkingDirectory "$test\bin" -NoNewWindow -PassThru `
                   -RedirectStandardOutput "$out\$aName.out.txt" -RedirectStandardError "$out\$aName.err.txt"
            $null = $p.Handle   # keeps the exit code
            if( -not $p.WaitForExit( 2700000 ) ) {
              Stop-Process -Id $p.Id -Force
              $p.WaitForExit()
              $code = 'timeout'
            } else {
              $code = if( $p.ExitCode -eq 0 ) { 0 } else { '0x{0:X8}' -f $p.ExitCode }
            }
            Get-Content "$out\$aName.out.txt", "$out\$aName.err.txt" -ErrorAction SilentlyContinue
            Write-Output "::endgroup::"
            Write-Output "$aName : $code"
            if( $code -ne 0 ) { $script:failed += "$aName ($code)" }
          }

          Run-Package 'kicad-cli-version' 'kicad-cli.exe' @( 'version' )
          Run-Package 'kicad-cli-svg' 'kicad-cli.exe' @( 'pcb', 'export', 'svg', '--layers', 'F.Cu',
                                                         '--output', "$out\board.svg", $board )
          if( -not ( Test-Path "$out\board.svg" ) ) { $failed += 'kicad-cli-svg (no SVG)' }

          # The libraries of the package: a footprint and a symbol plotted
          $libs = "$test\share\kicad"
          Run-Package 'kicad-cli-footprint' 'kicad-cli.exe' @( 'fp', 'export', 'svg', '--footprint',
                      'R_0603_1608Metric', '--output', "$out\footprint", "$libs\footprints\Resistor_SMD.pretty" )
          if( -not ( Get-ChildItem "$out\footprint\*.svg" -ErrorAction SilentlyContinue ) ) { $failed += 'kicad-cli-footprint (no SVG)' }
          Run-Package 'kicad-cli-symbol' 'kicad-cli.exe' @( 'sym', 'export', 'svg', '--symbol', 'R',
                      '--output', "$out\symbol", "$libs\symbols\Device.kicad_sym" )
          if( -not ( Get-ChildItem "$out\symbol\*.svg" -ErrorAction SilentlyContinue ) ) { $failed += 'kicad-cli-symbol (no SVG)' }

          Run-Package 'shell' 'qa_qt_kicad_shell.exe' @( $board, $sch, "$out\shell.png" )

          # Fontconfig finds its configuration (etc\fonts)
          $fontconfig = Select-String -Path "$out\*.txt" -Pattern 'Fontconfig (error|warning)'
          if( $fontconfig ) { $fontconfig | Select-Object -First 5; $failed += 'fontconfig' }

          if( $failed.Count -gt 0 ) {
            Write-Output "Failed: $( $failed -join ', ' )"
            exit 1
          }

      # The installer (NSIS) of the package
      - name: Installer
        id: installer
        if: always() && steps.build.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "${{ github.workspace }}"
          $version = ( Select-String -Path cmake\KiCadVersion.cmake -Pattern 'KICAD_SEMANTIC_VERSION "([^"]+)"' ).Matches[0].Groups[1].Value
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if( -not ( Test-Path $makensis ) ) {
            choco install -y --no-progress nsis
            if( $LASTEXITCODE -ne 0 ) { exit $LASTEXITCODE }
          }
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          $exe = "$root\installer\kicad-qt-$version-x86_64.exe"
          & $makensis /V2 "/DVERSION=$version" "/DSOURCE=$root\pkg" "/DROOT=$root" "/DOUTFILE=$exe" qt\tools\windows\kicad-qt.nsi
          if( $LASTEXITCODE -ne 0 ) { exit $LASTEXITCODE }
          "{0:N0} MB" -f ( ( Get-Item $exe ).Length / 1MB )
          "exe=$exe" >> $env:GITHUB_OUTPUT

      # The installer, silent: installed, KiCad starts from the start menu's program, uninstalled
      - name: Test of the installer
        if: always() && steps.installer.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "${{ github.workspace }}"
          $dir = 'C:\kicad-qt-test'
          $out = "$root\pkg-logs"
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\KiCad-Qt'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          Remove-Item Env:\PYTHONHOME, Env:\PYTHONPATH, Env:\QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          $failed = @()

          $p = Start-Process -FilePath "${{ steps.installer.outputs.exe }}" -ArgumentList '/S', "/D=$dir" -Wait -PassThru
          "install: $( $p.ExitCode )"
          foreach( $file in 'bin\kicad-qt.exe', 'bin\kicad-cli.exe', 'bin\qt.conf', 'etc\fonts\fonts.conf',
                            'share\kicad\template\sym-lib-table', 'uninstall.exe' ) {
            if( -not ( Test-Path "$dir\$file" ) ) { $failed += "installed: $file" }
          }
          if( -not ( Test-Path $key ) ) { $failed += 'the uninstall entry' }
          if( -not ( Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\KiCad (Qt)\KiCad.lnk" ) ) { $failed += 'the start menu' }

          & "$dir\bin\kicad-cli.exe" version
          if( $LASTEXITCODE -ne 0 ) { $failed += "kicad-cli ($LASTEXITCODE)" }

          # KiCad starts (a new configuration: the start wizard) and runs
          $env:KICAD_CONFIG_HOME = "$env:RUNNER_TEMP\kicad-config"
          $p = Start-Process -FilePath "$dir\bin\kicad-qt.exe" -PassThru
          Start-Sleep -Seconds 40
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage( $bmp ).CopyFromScreen( $b.Location, [System.Drawing.Point]::Empty, $b.Size )
            $bmp.Save( "$out\installed-kicad.png" )
          } catch { Write-Output "No screenshot: $_" }
          if( $p.HasExited ) {
            $failed += "kicad-qt ended: 0x{0:X8}" -f $p.ExitCode
          } else {
            "kicad-qt runs: $( ( Get-Process -Id $p.Id ).MainWindowTitle )"
            Stop-Process -Id $p.Id -Force
            $p.WaitForExit()
          }

          $p = Start-Process -FilePath "$dir\uninstall.exe" -ArgumentList '/S', "_?=$dir" -Wait -PassThru
          "uninstall: $( $p.ExitCode )"
          foreach( $file in 'bin', 'share', 'etc', 'lib' ) {
            if( Test-Path "$dir\$file" ) { $failed += "left after the uninstall: $file" }
          }
          if( Test-Path $key ) { $failed += 'the uninstall entry is left' }

          if( $failed.Count -gt 0 ) {
            Write-Output "Failed: $( $failed -join ', ' )"
            exit 1
          }

      - name: The installer
        if: always() && steps.installer.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kicad-qt-windows-x64-installer
          path: installer/*.exe
          compression-level: 0
          if-no-files-found: error

      # The portable version: the same package (tested alone above) in a zip, to extract and run
      # without installation (KiCad.cmd, or bin\kicad-qt.exe)
      - name: Portable
        id: portable
        if: always() && steps.build.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "${{ github.workspace }}"
          $version = ( Select-String -Path cmake\KiCadVersion.cmake -Pattern 'KICAD_SEMANTIC_VERSION "([^"]+)"' ).Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force -Path portable, portable-extra | Out-Null
          Set-Content -Path portable-extra\KiCad.cmd -Value "@start `"`" `"%~dp0bin\kicad-qt.exe`" %*"
          $zip = "$root\portable\kicad-qt-$version-x86_64-portable.zip"
          7z a -tzip -mx=5 -bso0 -bsp0 $zip "$root\pkg\*" "$root\portable-extra\KiCad.cmd"
          if( $LASTEXITCODE -ne 0 ) { exit $LASTEXITCODE }
          "{0:N0} MB" -f ( ( Get-Item $zip ).Length / 1MB )

          # The zip extracted works alone (kicad-cli without the PATH of the build)
          7z x -y -bso0 -bsp0 "-o$root\portable-test" $zip
          if( $LASTEXITCODE -ne 0 ) { exit $LASTEXITCODE }
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          & "$root\portable-test\bin\kicad-cli.exe" version
          if( $LASTEXITCODE -ne 0 ) { exit $LASTEXITCODE }
          if( -not ( Test-Path "$root\portable-test\KiCad.cmd" ) ) { exit 1 }

      - name: The portable version
        if: always() && steps.portable.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kicad-qt-windows-x64-portable
          path: portable/*.zip
          compression-level: 0
          if-no-files-found: error

      - name: Output of the test of the package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-test-windows
          path: pkg-logs
          if-no-files-found: ignore
