name: 'Qt build (Linux)'

# The Qt suite of KiCad (KICAD_WX_FREE + KICAD_QT_SHELL): kicad-qt with the Qt KIFACEs, built
# without wxWidgets, and the QA of the Qt frames run on a virtual X server.

on:
  push:
    branches: [ 'wx-free-core-upstream' ]
    paths-ignore: [ '**.md', 'demos/**', 'translation/**' ]
  workflow_dispatch:

concurrency:
  group: qt-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 4G
      CCACHE_COMPRESS: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache gettext swig xvfb gdb \
            qt6-base-dev qt6-base-dev-tools qt6-qpa-plugins qt6-wayland \
            libboost-all-dev libglm-dev libglew-dev libgl-dev libglu1-mesa-dev libegl-dev \
            libcairo2-dev libpixman-1-dev libharfbuzz-dev libfontconfig-dev libfreetype-dev \
            libcurl4-openssl-dev libgit2-dev libsecret-1-dev libnng-dev unixodbc-dev \
            libngspice0-dev libprotobuf-dev protobuf-compiler libzstd-dev zlib1g-dev \
            libocct-data-exchange-dev libocct-foundation-dev libocct-modeling-algorithms-dev \
            libocct-modeling-data-dev libocct-ocaf-dev libocct-visualization-dev \
            libpython3-dev python3-dev pybind11-dev libspnav-dev libzint-dev \
            libpoppler-dev libpoppler-glib-dev libsqlite3-dev libeigen3-dev \
            pkg-config libglib2.0-dev libwayland-dev wayland-protocols libpcre2-dev \
            libexpat1-dev libpng-dev libjpeg-dev libssl-dev libgtk-3-dev

      - name: Compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-qt-linux-${{ github.sha }}
          restore-keys: ccache-qt-linux-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DKICAD_WX_FREE=ON -DKICAD_QT_SHELL=ON -DKICAD_BUILD_QA_TESTS=ON \
            -DKICAD_USE_PCH=OFF

      - name: Build
        run: |
          cmake --build build --target all \
            qa_qt_eeschema_frames qa_qt_pcbnew_frames qa_qt_tool_framework \
            qa_qt_3d_viewer qa_qt_kicad_shell -- -k 0
          ccache --show-stats

      # Every generated header (Qt bases of the dialogs, lexers) comes before the objects that
      # include it: a fresh parallel build can otherwise compile them first
      - name: Order of the generated headers
        run: python3 qt/tools/check_generated_deps.py build

      # Saved after the build, also when it or the QA fails
      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-qt-linux-${{ github.sha }}

      - name: QA of the Qt frames
        env:
          KICAD_RUN_FROM_BUILD_DIR: '1'
          QT_QPA_PLATFORM: xcb
        run: |
          set -e
          BOARD=$PWD/qa/data/pcbnew/api_kitchen_sink.kicad_pcb
          SCH=$PWD/qa/data/eeschema/erc_multiple_pin_to_pin.kicad_sch
          OUT=$PWD/qa-screenshots
          mkdir -p $OUT
          # Under gdb: the stacks of all the threads if a program crashes
          run() {
            timeout 900 xvfb-run -a -s "-screen 0 1920x1200x24" \
              gdb -q -batch -return-child-result -ex "handle SIGPIPE nostop noprint pass" -ex run -ex "thread apply all bt 40" --args "$@"
          }
          ( cd build/qt/qa && run ./qa_qt_pcbnew_frames $BOARD )
          ( cd build/qt/qa && run ./qa_qt_tool_framework $BOARD )
          ( cd build/qt/qa && run ./qa_qt_3d_viewer $BOARD )
          ( cd build/qt/qa && run ./qa_qt_eeschema_frames $SCH )
          ( cd build/kicad && run ./qa_qt_kicad_shell $BOARD $SCH $OUT/shell.png )

      - name: Install (staged)
        run: |
          DESTDIR=$PWD/stage cmake --install build
          ls stage/usr/bin
          # Every library the programs and the KIFACEs need is installed or on the system
          LIBDIR=$(dirname $(find $PWD/stage -name libkiqt.so))
          ! for f in stage/usr/bin/kicad-qt stage/usr/bin/*.kiface; do
              LD_LIBRARY_PATH=$LIBDIR ldd $f | grep "not found"
            done | grep .

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-screenshots
          path: qa-screenshots
          if-no-files-found: ignore
