name: 'Qt build (Linux)'

# The Qt suite of KiCad (KICAD_WX_FREE + KICAD_QT_SHELL): kicad-qt with the Qt KIFACEs, built
# without wxWidgets, and the QA of the Qt frames run on a virtual X server.

on:
  push:
    branches: [ 'wx-free-core-upstream' ]
    paths-ignore: [ '**.md', 'demos/**', 'translation/**' ]
  workflow_dispatch:

concurrency:
  group: qt-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    # The nightly release (the last step)
    permissions:
      contents: write

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 4G
      CCACHE_COMPRESS: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache gettext swig xvfb gdb \
            qt6-base-dev qt6-base-dev-tools qt6-qpa-plugins qt6-wayland qt6-image-formats-plugins \
            qt6-webengine-dev qt6-webchannel-dev \
            libboost-all-dev libglm-dev libglew-dev libgl-dev libglu1-mesa-dev libegl-dev \
            libcairo2-dev libpixman-1-dev libharfbuzz-dev libfontconfig-dev libfreetype-dev \
            libcurl4-openssl-dev libgit2-dev libsecret-1-dev libnng-dev unixodbc-dev \
            libngspice0-dev libprotobuf-dev protobuf-compiler libzstd-dev zlib1g-dev \
            libocct-data-exchange-dev libocct-foundation-dev libocct-modeling-algorithms-dev \
            libocct-modeling-data-dev libocct-ocaf-dev libocct-visualization-dev \
            libpython3-dev python3-dev pybind11-dev libspnav-dev libzint-dev \
            libpoppler-dev libpoppler-glib-dev libsqlite3-dev libeigen3-dev \
            pkg-config libglib2.0-dev libwayland-dev wayland-protocols libpcre2-dev \
            libexpat1-dev libpng-dev libjpeg-dev libssl-dev libgtk-3-dev \
            glslang-tools spirv-tools libvulkan-dev

      - name: Compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-qt-linux-${{ github.sha }}
          restore-keys: ccache-qt-linux-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DKICAD_WX_FREE=ON -DKICAD_QT_SHELL=ON -DKICAD_BUILD_QA_TESTS=ON \
            -DKICAD_USE_PCH=OFF

      - name: Build
        run: |
          cmake --build build --target all \
            qa_qt_eeschema_frames qa_qt_pcbnew_frames qa_qt_tool_framework \
            qa_qt_3d_viewer qa_qt_kicad_shell -- -k 0
          ccache --show-stats

      # Every generated header (Qt bases of the dialogs, lexers) comes before the objects that
      # include it: a fresh parallel build can otherwise compile them first
      - name: Order of the generated headers
        run: python3 qt/tools/check_generated_deps.py build

      # Saved after the build, also when it or the QA fails
      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-qt-linux-${{ github.sha }}

      - name: QA of the Qt frames
        env:
          KICAD_RUN_FROM_BUILD_DIR: '1'
          QT_QPA_PLATFORM: xcb
          # The runners do not let Chromium make its sandbox (user namespaces): the pages of the
          # tests are local ones
          QTWEBENGINE_DISABLE_SANDBOX: '1'
        run: |
          set -e
          BOARD=$PWD/qa/data/pcbnew/api_kitchen_sink.kicad_pcb
          SCH=$PWD/qa/data/eeschema/erc_multiple_pin_to_pin.kicad_sch
          OUT=$PWD/qa-screenshots
          mkdir -p $OUT
          # Under gdb: the stacks of all the threads if a program crashes
          run() {
            timeout 900 xvfb-run -a -s "-screen 0 1920x1200x24" \
              gdb -q -batch -return-child-result -ex "handle SIGPIPE nostop noprint pass" -ex run -ex "thread apply all bt 40" --args "$@"
          }
          ( cd build/qt/qa && run ./qa_qt_pcbnew_frames $BOARD $OUT/pcbnew.png )
          ( cd build/qt/qa && run ./qa_qt_tool_framework $BOARD )
          ( cd build/qt/qa && run ./qa_qt_3d_viewer $BOARD )
          ( cd build/qt/qa && run ./qa_qt_eeschema_frames $SCH )
          ( cd build/kicad && run ./qa_qt_kicad_shell $BOARD $SCH $OUT/shell.png )
          # The 3D models read by the 3D plugins (kicad-cli, as the 3D viewer finds them)
          bash qt/tools/ci/check_3d_models.sh $RUNNER_TEMP/3d-models build/kicad/kicad-cli

      # The shell again as on a computer in Italian with the screen scaled to 125% (the decimal
      # comma, the translated texts, the fractional scale of the icons and of the painted widgets)
      - name: QA of the shell in Italian at 125%
        if: always()
        env:
          KICAD_RUN_FROM_BUILD_DIR: '1'
          QT_QPA_PLATFORM: xcb
          QT_SCALE_FACTOR: '1.25'
          QTWEBENGINE_DISABLE_SANDBOX: '1'
        run: |
          set -e
          sudo locale-gen it_IT.UTF-8
          export LANG=it_IT.UTF-8 LC_ALL=it_IT.UTF-8 LANGUAGE=it
          BOARD=$PWD/qa/data/pcbnew/api_kitchen_sink.kicad_pcb
          SCH=$PWD/qa/data/eeschema/erc_multiple_pin_to_pin.kicad_sch
          OUT=$PWD/qa-screenshots/it
          mkdir -p $OUT
          cd build/kicad
          timeout 900 xvfb-run -a -s "-screen 0 1920x1200x24" \
            gdb -q -batch -return-child-result -ex "handle SIGPIPE nostop noprint pass" -ex run \
              -ex "thread apply all bt 40" --args ./qa_qt_kicad_shell $BOARD $SCH $OUT/shell.png

      # The canvas with the OpenGL GAL (Mesa, in software) on a screen scaled to 125%: the cursor
      # under the mouse and the drawing over the whole window, as on Windows at 125%
      - name: QA of the OpenGL canvas at 125%
        if: always()
        env:
          KICAD_RUN_FROM_BUILD_DIR: '1'
          QT_QPA_PLATFORM: xcb
          QT_SCALE_FACTOR: '1.25'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -e
          BOARD=$PWD/qa/data/pcbnew/api_kitchen_sink.kicad_pcb
          cd build/qt/qa
          timeout 900 xvfb-run -a -s "-screen 0 1920x1200x24" \
            gdb -q -batch -return-child-result -ex "handle SIGPIPE nostop noprint pass" -ex run \
              -ex "thread apply all bt 40" --args ./qa_qt_tool_framework --opengl $BOARD

      - name: Install (staged)
        run: |
          DESTDIR=$PWD/stage cmake --install build
          ls stage/usr/bin
          # Every library the programs and the KIFACEs need is installed or on the system
          LIBDIR=$(dirname $(find $PWD/stage -name libkiqt.so))
          ! for f in stage/usr/bin/kicad-qt stage/usr/bin/*.kiface; do
              LD_LIBRARY_PATH=$LIBDIR ldd $f | grep "not found"
            done | grep .

      # The AppImage: the staged install, the libraries of KiCad (symbols, footprints, template)
      # and every library it needs but the base of the system (linuxdeploy, with Qt and its plugins)
      - name: AppImage
        id: appimage
        run: |
          set -e
          VERSION=$(sed -n 's/.*KICAD_SEMANTIC_VERSION "\([^"]*\)".*/\1/p' cmake/KiCadVersion.cmake)
          SERIES=$(echo $VERSION | cut -d. -f1-2)
          mkdir -p libs tools
          for repo in kicad-symbols kicad-footprints kicad-templates; do
            echo "::group::$repo"
            git clone -q --depth 1 --branch $VERSION https://gitlab.com/kicad/libraries/$repo.git libs/$repo \
              || git clone -q --depth 1 --branch $SERIES https://gitlab.com/kicad/libraries/$repo.git libs/$repo
            cmake -S libs/$repo -B libs/build-$repo -G Ninja -DCMAKE_INSTALL_PREFIX=$PWD/libs/inst
            cmake --build libs/build-$repo
            cmake --install libs/build-$repo | tail -3
            echo "::endgroup::"
          done
          for tool in linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
                      linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage; do
            curl -fsSL --retry 3 -o tools/$(basename $tool) https://github.com/$tool
          done
          chmod +x tools/*.AppImage
          ln -sf linuxdeploy-plugin-qt-x86_64.AppImage tools/linuxdeploy-plugin-qt
          export PATH=$PWD/tools:$PATH APPIMAGE_EXTRACT_AND_RUN=1 QMAKE=/usr/lib/qt6/bin/qmake
          export LINUXDEPLOY=$PWD/tools/linuxdeploy-x86_64.AppImage
          bash qt/tools/ci/appimage.sh stage appimage $VERSION libs/inst/share/kicad
          # The image formats of qtimageformats (TIFF, WebP) and the 3D plugins in the AppImage
          ls stage/usr/plugins/imageformats/libqtiff.so stage/usr/plugins/imageformats/libqwebp.so
          ls stage/usr/lib/*/kicad/plugins/3d/libs3d_plugin_oce.so stage/usr/lib/*/kicad/plugins/3d/libs3d_plugin_vrml.so

          # The AppImage works alone: kicad-cli, and kicad-qt starts (and is still running when
          # stopped)
          IMAGE=$(ls $PWD/appimage/*.AppImage)
          cd $RUNNER_TEMP
          env -i HOME=$HOME PATH=/usr/bin:/bin APPIMAGE_EXTRACT_AND_RUN=1 $IMAGE kicad-cli version
          bash $GITHUB_WORKSPACE/qt/tools/ci/check_3d_models.sh $RUNNER_TEMP/3d-models-appimage \
            env -i HOME=$HOME PATH=/usr/bin:/bin APPIMAGE_EXTRACT_AND_RUN=1 $IMAGE kicad-cli
          rc=0
          env -i HOME=$HOME PATH=/usr/bin:/bin APPIMAGE_EXTRACT_AND_RUN=1 \
            timeout 90 xvfb-run -a $IMAGE || rc=$?
          echo "kicad-qt: $rc"
          test $rc -eq 124

      - name: The AppImage
        if: always() && steps.appimage.outcome == 'success'
        uses: actions/upload-artifact@v7
        # Not zipped again: the download is the file itself (named as the file)
        with:
          path: appimage/*.AppImage
          archive: false
          if-no-files-found: error

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-screenshots
          path: qa-screenshots
          if-no-files-found: ignore

      # The packages on the home page of the repository: the nightly pre-release, after a green run
      # of the main branch
      - name: Nightly release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/wx-free-core-upstream'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash qt/tools/ci/nightly_release.sh '\.AppImage$' appimage/*.AppImage

  # The core alone (KICAD_WX_FREE + KICAD_HEADLESS_ONLY): kicad-cli and its KIFACEs with no Qt,
  # no OpenGL and no desktop library, run with no display (batch DRC/ERC, exports)
  headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: 'true'

    steps:
      - uses: actions/checkout@v4

      # No Qt, no GLEW/GLU, no GTK, no Wayland, no Poppler, no spnav, no libsecret (the OCCT
      # packages still bring the GL headers: the check below makes sure nothing uses them)
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache gettext swig \
            libboost-all-dev libglm-dev \
            libcairo2-dev libpixman-1-dev libharfbuzz-dev libfontconfig-dev libfreetype-dev \
            libcurl4-openssl-dev libgit2-dev libnng-dev unixodbc-dev \
            libngspice0-dev libprotobuf-dev protobuf-compiler libzstd-dev zlib1g-dev \
            libocct-data-exchange-dev libocct-foundation-dev libocct-modeling-algorithms-dev \
            libocct-modeling-data-dev libocct-ocaf-dev \
            libpython3-dev python3-dev pybind11-dev libzint-dev \
            libsqlite3-dev libeigen3-dev pkg-config libglib2.0-dev libpcre2-dev \
            libexpat1-dev libpng-dev libjpeg-dev libssl-dev \
            glslang-tools spirv-tools
          ! dpkg -l | grep -E '^ii +(qt6-|libgtk-3-dev|libwayland-dev|libpoppler|libspnav|libsecret-1-dev|libglew)'

      - name: Compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-headless-linux-${{ github.sha }}
          restore-keys: ccache-headless-linux-

      # The finds of the desktop libraries are disabled: the configuration fails if one is
      # still required
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DKICAD_WX_FREE=ON -DKICAD_HEADLESS_ONLY=ON -DKICAD_USE_PCH=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_OpenGL=ON -DCMAKE_DISABLE_FIND_PACKAGE_Poppler=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_Wayland=ON -DCMAKE_DISABLE_FIND_PACKAGE_SPNAV=ON

      - name: Build
        run: |
          cmake --build build --target all
          ccache --show-stats

      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-headless-linux-${{ github.sha }}

      - name: No GUI, GL or desktop dependency
        run: python3 qt/tools/ci/check_headless.py build

      - name: kicad-cli without display
        run: qt/tools/ci/headless_cli_test.sh build/kicad/kicad-cli headless-out

      - name: Outputs of kicad-cli
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-cli-outputs
          path: headless-out
          if-no-files-found: ignore
